name: radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Duas execuções ao mesmo tempo publicariam em dobro e conflitariam no estado (ADR 0001).
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Rodar um ciclo
        run: uv run python -m radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL_ID: ${{ secrets.TELEGRAM_CANAL_ID }}
          TELEGRAM_REVISOR_ID: ${{ secrets.TELEGRAM_REVISOR_ID }}
      - name: Salvar estado
        if: always()
        run: |
          git add estado/
          git diff --cached --quiet && exit 0
          git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" \
            commit -m "estado: ciclo $(date -u +%FT%TZ)"
          git push
