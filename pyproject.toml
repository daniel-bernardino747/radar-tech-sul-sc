[project]
name = "radar"
version = "0.1.0"
description = "Radar de eventos de tecnologia do Sul de SC, divulgados num canal do Telegram."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "icalendar>=6.1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
